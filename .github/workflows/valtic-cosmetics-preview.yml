name: Build Valtic Cosmetics Preview (Fabric 26.3)

on:
  workflow_dispatch:
  push:
    paths:
      - 'cosmetic-preview-source.tar.xz'
      - '.github/workflows/valtic-cosmetics-preview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Valtic repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Unpack cosmetic mod source
        run: |
          mkdir -p cosmetic-preview
          tar -xJf cosmetic-preview-source.tar.xz -C cosmetic-preview
      - name: Build Fabric 26.3 preview mod
        working-directory: cosmetic-preview
        run: gradle build --no-daemon --stacktrace
      - name: Upload preview mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: valtic-cosmetics-preview-fabric-26.3
          path: cosmetic-preview/build/libs/valtic-cosmetics-preview-0.1.0.jar
          if-no-files-found: error
