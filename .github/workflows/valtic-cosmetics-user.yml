name: Build Valtic Cosmetics (Fabric 26.3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'valtic-cosmetics-mod/**'
      - '.github/workflows/valtic-cosmetics-user.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Compile Valtic Cosmetics Fabric 26.3
        working-directory: valtic-cosmetics-mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: valtic-cosmetics-fabric-26.3
          path: valtic-cosmetics-mod/build/libs/valtic-cosmetics-1.0.0.jar
          if-no-files-found: error
